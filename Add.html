
<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f2f5fa;
            padding: 20px;
            font-family: Arial;
        }

        .main {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            color: #173b65;
            text-align: center;
        }

        .total {
            text-align: center;
            color: #1764a5;
            margin: 15px;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 750px;
            table-layout: fixed;
            border-collapse: collapse;
        }

        table th, table td {
            padding: 12px 8px !important;
            text-align: center !important;
            vertical-align: middle !important;
            white-space: nowrap;
        }

        table th:nth-child(1),
        table td:nth-child(1) {
            width: 8%;
        }

        table th:nth-child(2),
        table td:nth-child(2) {
            width: 20%;
        }

        table th:nth-child(3),
        table td:nth-child(3) {
            width: 28%;
        }

        table th:nth-child(4),
        table td:nth-child(4) {
            width: 17%;
        }

        table th:nth-child(5),
        table td:nth-child(5) {
            width: 27%;
        }

        thead th {
            background: #173b65 !important;
            color: white !important;
        }
    </style>
</head>

<body>

<div class="container main">

    <h2>Student Management</h2>

    <h5 class="total">
        Total Students: <span id="total">250</span>
    </h5>

    <input type="text" id="search"
        class="form-control mb-3"
        placeholder="Search student..."
        oninput="showStudents()">

    <div class="table-responsive">

        <table class="table table-bordered table-striped">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Class</th>
                    <th>Phone</th>
                </tr>
            </thead>

            <tbody id="studentList"></tbody>

        </table>

    </div>

</div>

<script>

const firstNames = [
    "Rahul","Amit","Rohit","Suman","Priya",
    "Anjali","Ravi","Pooja","Vikash","Neha",
    "Arjun","Karan","Sneha","Deepak","Riya",
    "Manoj","Kajal","Akash","Sunita","Raj"
];

const lastNames = [
    "Kumar","Das","Patel","Sharma","Singh",
    "Sahu","Nayak","Gupta","Jena","Verma",
    "Behera","Mishra","Pradhan","Rout"
];

const classes = [
    "Class 8","Class 9","Class 10",
    "Class 11","Class 12"
];

let students = [];

function randomItem(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

// Generate 250 students

for (let i = 1; i <= 250; i++) {

    students.push({
        id: i,
        name: randomItem(firstNames) + " " +
              randomItem(lastNames),
        email: "student" + i + "@gmail.com",
        class: randomItem(classes),
        phone: "9" + String(100000000 + i).slice(0,9)
    });

}

// Display students

function showStudents() {

    let search = document.getElementById("search")
        .value.toLowerCase();

    let filtered = students.filter(student =>
        student.name.toLowerCase().includes(search) ||
        student.email.toLowerCase().includes(search) ||
        student.class.toLowerCase().includes(search)
    );

    let output = "";

    filtered.forEach(student => {

        output += `
        <tr>
            <td>${student.id}</td>
            <td>${student.name}</td>
            <td>${student.email}</td>
            <td>${student.class}</td>
            <td>${student.phone}</td>
        </tr>
        `;

    });

    document.getElementById("studentList").innerHTML =
        output;
}

showStudents();

</script>

</body>
</html>
